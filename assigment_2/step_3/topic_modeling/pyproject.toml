[project]
name = "topic-modeling"
version = "0.1.0"
description = ""
authors = [
    {name = "G4 OpenScience"}
]
license = {text = "MIT"}
requires-python = ">=3.11,<=3.13"
dependencies = [
    "scikit-learn (>=1.8.0,<2.0.0)",
    "sentence-transformers (>=5.5.0,<6.0.0)",
    "bertopic (>=0.17.4,<0.18.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",

    # PyTorch CPU explícito para evitar que Docker/Poetry coja una build rota o CUDA
    "torch (==2.7.0+cpu)"
]

[tool.poetry.dependencies]
torch = { version = "==2.7.0+cpu", source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"