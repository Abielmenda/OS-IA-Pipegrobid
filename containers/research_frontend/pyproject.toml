[project]
name = "research-frontend"
version = "0.1.0"
description = "Streamlit frontend for the Research Funding Knowledge Graph API."
authors = [
    { name = "G4 OpenScience" }
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "streamlit==1.40.2",
    "requests>=2.32,<3.0",
    "pandas>=2.2,<3.0",
    "plotly>=5.24,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
requests-mock = ">=1.12,<2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".pytest_cache"
