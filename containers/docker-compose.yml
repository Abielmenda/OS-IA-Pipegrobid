services:

# *** Gestión del wokflow ***
  n8n:
    build: ./n8n_container
    container_name: n8n
    user: root
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_container/n8n_data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace
    networks:
      - net
    group_add:
      - "998"
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - NODES_EXCLUDE=[]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_USER_FOLDER=/home/node/.n8n
      
      # Para imports desde /workspace
      - PYTHONPATH=/workspace
      - N8N_RESTRICT_FILE_ACCESS_TO=/workspace;/root/.n8n-files

  grobid:
    image: grobid/grobid:0.7.2
    networks:
      - net

  pipegrobid:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pipegrobid
    depends_on:
      - grobid
    command: tail -f /dev/null
    environment:
      - GROBID_URL=http://grobid:8070
    volumes:
      - ../pdfs:/app/pdfs
      - ../outputs/xmls:/app/xmls
      - ../outputs/generated_files:/app/generated_files
    networks:
      - net

  fuseki:
    image: stain/jena-fuseki
    container_name: fuseki
    ports:
      - "3030:3030"
    volumes:
      # Persistencia de Fuseki
      - ./fuseki_container/fuseki_data:/fuseki

      # Carpeta opcional para cargar TTL/RDF desde el host
      - ../outputs:/staging
    networks:
      - net
    environment:
      - ADMIN_PASSWORD=admin
      - FUSEKI_DATASET_1=kg
      - TDB=2
      - JVM_ARGS=-Xmx2g


  python_runner:
    build: 
      context: ..
      dockerfile: containers/python_container/Dockerfile
    container_name: python_runner
    volumes:
      - ..:/workspace
      - ./python_container/poetry_cache:/opt/poetry-cache
    networks:
      - net
    environment:
      - PYTHONPATH=/workspace
      - POETRY_VIRTUALENVS_IN_PROJECT=false
      - POETRY_VIRTUALENVS_PATH=/opt/poetry-venvs
      - POETRY_CACHE_DIR=/opt/poetry-cache
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}


  research_api:
    build:
      context: ./research_api/app
      dockerfile: Dockerfile
    container_name: research_api
    ports:
      - "8000:8000"
    environment:
      FUSEKI_QUERY_URL: "http://fuseki:3030/kg/query"
    volumes:
      - ./research_api/app:/app
    networks:
      - net
    restart: unless-stopped

  research_frontend:
    build:
      context: ./research_frontend
      dockerfile: Dockerfile
    container_name: research_frontend
    ports:
      - "8501:8501"
    environment:
      - RESEARCH_API_URL=http://research_api:8000
    depends_on:
      - research_api
    volumes:
      - ./research_frontend:/app
    networks:
      - net
    restart: unless-stopped
    
networks:
  net:
    driver: bridge
